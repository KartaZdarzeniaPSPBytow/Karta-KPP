<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karta KPP</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, Helvetica, sans-serif;
    background: #e9ecef;
    color: #222;
}

.container {
    max-width: 1050px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
}

h1 {
    text-align: center;
    color: #b30000;
    font-size: 26px;
    text-transform: uppercase;
    margin-bottom: 22px;
}

h2 {
    background: #b30000;
    color: white;
    padding: 9px 13px;
    border-radius: 6px;
    font-size: 17px;
    margin-top: 22px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
}

label {
    font-weight: bold;
    margin-bottom: 4px;
}

input[type="text"],
input[type="date"],
input[type="number"],
textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 14px;
}

textarea {
    resize: vertical;
}

/* SAMPLE */

.sample {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.sample-item {
    display: flex;
    flex-direction: column;
}

.sample label {
    font-size: 13px;
    margin-bottom: 3px;
}

.sample textarea {
    height: 43px;
    min-height: 43px;
    padding: 6px;
    font-size: 13px;
}

/* AVPU */

.avpu {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.avpu label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
    font-weight: normal;
    cursor: pointer;
}

.avpu label:hover {
    background: #f0f0f0;
}

.avpu-letter {
    font-size: 20px;
    font-weight: bold;
    color: #b30000;
    min-width: 25px;
}

/* PARAMETRY */

.parameters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

/* CHECKBOXY */

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px 18px;
    padding: 9px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fafafa;
}

.options label {
    font-weight: normal;
    margin: 0;
}

/* ABC */

.abc-row {
    display: grid;
    grid-template-columns: 65px 1fr;
    gap: 12px;
    margin-bottom: 12px;
}

.abc-letter {
    font-size: 25px;
    font-weight: bold;
    color: #b30000;
    text-align: center;
    padding: 8px;
    border: 2px solid #b30000;
    border-radius: 6px;
}

/* PODPIS */

.signature {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    width: 100%;
}

.signature .field {
    width: 50%;
    text-align: center;
}

.signature .field label {
    text-align: center;
}

.signature input {
    text-align: center;
}

/* PRZYCISK */

button {
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    background: #5865F2;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4752C4;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.status {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
    white-space: pre-line;
}

/* MOBILE */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }

    .container {
        padding: 14px;
    }

    .grid,
    .grid-3,
    .parameters {
        grid-template-columns: 1fr;
    }

    .signature {
        display: flex;
        justify-content: center;
    }

    .signature .field {
        width: 100%;
        text-align: center;
    }

    .signature .field label {
        text-align: center;
    }

    .signature input {
        text-align: center;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .abc-row {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

/* =====================================================
   POBIERANIE WARTOŚCI
===================================================== */

function getValue(id) {

    const element =
        document.getElementById(id);

    if (!element) {
        return "—";
    }

    const value =
        element.value.trim();

    return value || "—";
}


/* =====================================================
   RADIO
===================================================== */

function getRadio(name) {

    const element =
        document.querySelector(
            'input[name="' +
            name +
            '"]:checked'
        );

    return element
        ? element.value
        : "Nie podano";
}


/* =====================================================
   CHECKBOXY
===================================================== */

function getCheckboxes(name) {

    const elements =
        document.querySelectorAll(
            'input[name="' +
            name +
            '"]:checked'
        );

    if (!elements.length) {
        return "—";
    }

    return Array.from(elements)
        .map(element => "☑ " + element.value)
        .join("\n");
}


/* =====================================================
   OGRANICZENIE DŁUGOŚCI
===================================================== */

function limitText(text, max = 1000) {

    if (!text) {
        return "—";
    }

    if (text.length <= max) {
        return text;
    }

    return text.substring(0, max - 20)
        + "\n...[obcięto]";
}

            {
                name:
                    "⚠️ RODZAJ OBJAWÓW",

                value:
                    limitText(
                        getCheckboxes("objawy") +
                        "\n\n**Inne:** " +
                        getValue("inne_objawy")
                    ),

                inline: false
            },

            {
                name:
                    "🩺 POSTĘPOWANIE",

                value:
                    getCheckboxes("postepowanie"),

                inline: false
            },

            {
                name:
                    "✍️ PODPIS",

                value:
                    "\n**Ratownik:** " +
                    getValue("podpis"),

                inline: false
            }

        ],

        footer: {
            text: "Karta KPP"
        },

        timestamp: new Date().toISOString()

    };


    /* =================================================
       WYSŁANIE DO DISCORDA
    ================================================= */

    try {

        const webhookUrl =
            DISCORD_WEBHOOK +
            "?wait=true";


        const response =
            await fetch(
                webhookUrl,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                "Karta KPP",

                            embeds:
                                [embed],

                            allowed_mentions: {
                                parse: []
                            }

                        })

                }
            );


        /* BŁĄD */

        if (!response.ok) {

            let errorMessage =
                "Discord HTTP " +
                response.status;


            try {

                const errorData =
                    await response.json();


                if (errorData.message) {

                    errorMessage +=
                        "\n" +
                        errorData.message;

                }

            } catch {

                /* Brak JSON */

            }


            throw new Error(
                errorMessage
            );
        }


        /* SUKCES */

        status.style.color =
            "green";

        status.innerText =
            "✅ Karta została wysłana na Discord!";


    } catch (error) {

        console.error(
            "BŁĄD DISCORD:",
            error
        );


        status.style.color =
            "red";


        status.innerText =
            "❌ Nie udało się wysłać karty.\n\n" +
            error.message +
            "\n\n" +
            "Jeżeli widzisz błąd CORS, otwórz stronę " +
            "z normalnego hostingu HTTPS, a nie przez file://.";


    } finally {

        button.disabled =
            false;

    }

}


/* =====================================================
   PRZYCISK
===================================================== */

document
    .getElementById("sendButton")
    .addEventListener(
        "click",
        wyslijNaDiscord
    );

</script>
